name: Archive MVP prompts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-mvp-prompts.yml'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate prompt archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path('docs/tasks')
          directories = sorted(path for path in root.iterdir() if path.is_dir())
          if not directories:
              raise SystemExit('No task directories found to archive')

          source_files = sorted(
              path
              for directory in directories
              for path in directory.rglob('*')
              if path.is_file()
          )
          if not source_files:
              raise SystemExit('No prompt files found to archive')

          archive = root / 'mvp prompts.zip'
          with ZipFile(archive, 'w', compression=ZIP_DEFLATED, compresslevel=9) as output:
              for path in source_files:
                  output.write(path, path.relative_to(root))

          expected = {path.relative_to(root).as_posix() for path in source_files}
          with ZipFile(archive, 'r') as check:
              if check.testzip() is not None:
                  raise SystemExit('Archive integrity validation failed')
              actual = set(check.namelist())
              if actual != expected:
                  missing = sorted(expected - actual)
                  extra = sorted(actual - expected)
                  raise SystemExit(f'Archive contents mismatch: missing={missing!r}, extra={extra!r}')

          print(f'Archived {len(directories)} task folders and {len(source_files)} files into {archive}')
          PY

      - name: Replace task folders with archive
        shell: bash
        run: |
          set -euo pipefail
          find docs/tasks -mindepth 1 -maxdepth 1 -type d -exec rm -rf -- {} +
          rm .github/workflows/archive-mvp-prompts.yml
          test -f 'docs/tasks/mvp prompts.zip'
          test "$(find docs/tasks -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 0
          test "$(find docs/tasks -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1

      - name: Commit archive cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- docs/tasks .github/workflows/archive-mvp-prompts.yml
          git commit -m 'docs: archive MVP prompts'
          git push origin HEAD:main
